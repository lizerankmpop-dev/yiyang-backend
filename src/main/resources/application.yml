server:
  port: 8081

spring:
  profiles:
    active: dev

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
      file-size-threshold: 0B

  # 本地MySQL固定配置
  # 安全性：账号密码通过环境变量注入（MYSQL_USERNAME / MYSQL_PASSWORD），请勿硬编码
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/yiyang?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:yiyang}
    password: ${MYSQL_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  # Redis本地默认（没装Redis也能启动项目）
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

# JWT配置
# 安全性：生产环境请通过环境变量 JWT_SECRET 覆盖（HS256 要求至少 32 字节）
jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-me-32bytes}
  expiration: 86400000
  refresh-expiration: 604800000

# 分页配置
page:
  default-size: 10
  max-size: 100

# 文件上传路径
file:
  upload-dir: ./uploads
